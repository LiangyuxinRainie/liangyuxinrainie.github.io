name: Update visitor map

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-visitors.yml
      - scripts/update-visitor-stats.mjs
      - content/analytics.toml
      # Refresh generated statistics after manual uploads.
      - public/visitor-stats.json
  schedule:
    - cron: '15 */6 * * *'

permissions:
  contents: write
  actions: write

concurrency:
  group: update-visitor-map
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check GA4 configuration
        id: ga
        run: node scripts/update-visitor-stats.mjs --check-config
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID || vars.GA_PROPERTY_ID }}

      - name: Read GA4 reports
        if: steps.ga.outputs.configured == 'true'
        run: npm run update:visitors
        env:
          GA_CREDENTIALS: ${{ secrets.GA_CREDENTIALS }}
          GA_PROPERTY_ID: ${{ secrets.GA_PROPERTY_ID || vars.GA_PROPERTY_ID }}
          GA_STREAM_ID: ${{ vars.GA_STREAM_ID }}
          GA_START_DATE: ${{ vars.GA_START_DATE }}
          GA_END_DATE: today

      - name: Commit updated totals
        if: steps.ga.outputs.configured == 'true'
        run: |
          if ! git diff --quiet -- public/visitor-stats.json; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add public/visitor-stats.json
            git commit -m "Update visitor statistics"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      # GITHUB_TOKEN pushes do not trigger push workflows. Dispatch explicitly,
      # also retrying deployment when the previous run failed after committing.
      - name: Deploy refreshed map
        if: steps.ga.outputs.configured == 'true'
        run: gh workflow run deploy.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
